name: pingnet_cve
description: Ping & Net Tools with integrated CVE Search
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  dart_ping: ^9.0.1
  network_info_plus: ^5.0.3
  dns_client: ^1.3.1
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceMono
      fonts:
        - asset: fonts/SpaceMono-Regular.ttf
        - asset: fonts/SpaceMono-Bold.ttf
          weight: 700
